<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Turbofan Explorer</title>
<style>
:root{--o:#ff7a1a;--pn:rgba(12,16,22,.76);--bd:rgba(255,255,255,.11);--tx:#e8edf3;--mu:#8b97a6}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;color:var(--tx);background:radial-gradient(ellipse at 50% 38%,#16202c 0%,#080b10 62%,#04060a 100%);font:13px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none;cursor:grab}
#title{position:fixed;top:max(12px,env(safe-area-inset-top));left:16px;pointer-events:none}
#title h1{font-size:clamp(15px,2.4vw,24px);font-weight:800;letter-spacing:.3em}
#title h1 span{color:var(--o)}
#title p{color:var(--mu);font-size:11px;letter-spacing:.06em;margin-top:2px}
.panel{background:var(--pn);border:1px solid var(--bd);border-radius:14px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 10px 40px rgba(0,0,0,.45)}
#info{position:fixed;top:max(12px,env(safe-area-inset-top));right:12px;width:min(320px,calc(100vw - 24px));padding:14px;max-height:46vh;overflow:auto}
.stage-name{font-size:22px;font-weight:800;letter-spacing:.18em}
.stage-sub{color:var(--mu);font-size:11px;letter-spacing:.1em;text-transform:uppercase}
#stageDesc{margin:6px 0 10px;color:#c6cfda}
.readouts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.readouts div{background:rgba(255,255,255,.04);border-radius:8px;padding:6px 4px;text-align:center}
.readouts b{display:block;font-size:13px;font-variant-numeric:tabular-nums}
.readouts small{color:var(--mu);font-size:9px;letter-spacing:.05em;text-transform:uppercase}
#partCard{margin-top:10px;padding-top:10px;border-top:1px solid var(--bd)}
#partCard h3{font-size:13px;color:var(--o);letter-spacing:.08em;text-transform:uppercase}
#partCard p{color:#c6cfda;margin-top:3px}
#dock{position:fixed;left:50%;transform:translateX(-50%);bottom:max(10px,env(safe-area-inset-bottom));width:min(780px,calc(100vw - 20px));padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.row{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.row.scroll{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;scrollbar-width:none;padding-bottom:2px}
.row.scroll::-webkit-scrollbar{display:none}
.btn,.chip{flex:0 0 auto;border:1px solid var(--bd);background:rgba(255,255,255,.05);color:var(--tx);padding:8px 13px;border-radius:999px;font:600 11.5px system-ui,sans-serif;letter-spacing:.07em;cursor:pointer;transition:background .15s,border-color .15s,color .15s;white-space:nowrap}
.btn:hover,.chip:hover{border-color:rgba(255,255,255,.3)}
.btn[aria-pressed=true]{background:var(--o);border-color:var(--o);color:#1b0d02}
.chip{padding:6px 11px;font-size:11px;display:inline-flex;align-items:center;gap:6px}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c,#888);box-shadow:0 0 8px var(--c,#888)}
#stages .chip{padding:8px 14px;font-size:12px;letter-spacing:.14em}
.chip.active{border-color:var(--c,var(--o));background:rgba(255,255,255,.12)}
.chip.sel{border-color:var(--o);color:var(--o)}
.throttle{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.throttle span{font-weight:700;letter-spacing:.14em;font-size:11px;color:var(--mu)}
.throttle output{width:42px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--o);height:28px;background:transparent}
#dockToggle{position:absolute;right:8px;top:-34px;padding:6px 12px;background:var(--pn);display:none}
#dock.min .collapsible{display:none}
.tag{position:fixed;left:0;top:0;padding:3px 8px;border-radius:6px;background:rgba(10,14,20,.88);border:1px solid var(--o);font:600 11px system-ui,sans-serif;letter-spacing:.04em;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .15s;will-change:transform}
.tag.on{opacity:1}
.tag.vel{border-color:#7fd0ff;color:#bfe8ff}
@media (max-width:700px){
  #title p{display:none}
  #info{top:46px;left:10px;right:10px;width:auto;padding:10px;max-height:30vh}
  .stage-name{font-size:17px}
  #stageDesc{font-size:12px;margin:4px 0 8px}
  .readouts b{font-size:12px}
  #dock{padding:8px 10px;gap:6px}
  .btn{padding:7px 10px;font-size:10.5px}
  #dockToggle{display:block}
}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<canvas id="c" tabindex="0" aria-label="Interactive 3D turbofan engine"></canvas>
<div id="labels"></div>

<header id="title">
  <h1>TURBOFAN <span>EXPLORER</span></h1>
  <p>Drag: rotate · Scroll: zoom · Right-drag: pan</p>
</header>

<aside id="info" class="panel">
  <div class="stage-sub" id="stageSub">Tracing one air parcel</div>
  <div class="stage-name" id="stageName">SUCK</div>
  <p id="stageDesc"></p>
  <div class="readouts">
    <div><b id="rP">1.0</b><small>Pressure</small></div>
    <div><b id="rT">288 K</b><small>Gas temp</small></div>
    <div><b id="rN1">0</b><small>N1 rpm</small></div>
    <div><b id="rN2">0</b><small>N2 rpm</small></div>
  </div>
  <div id="partCard" hidden><h3 id="pName"></h3><p id="pDesc"></p></div>
</aside>

<section id="dock" class="panel">
  <button id="dockToggle" class="btn" type="button" aria-label="Collapse controls">Controls ▾</button>
  <div class="row collapsible" id="stages"></div>
  <div class="row" id="toggles">
    <button class="btn" id="bExplode" type="button" aria-pressed="false">Explode View</button>
    <button class="btn" id="bCut" type="button" aria-pressed="true">Cutaway View</button>
    <button class="btn" id="bAir" type="button" aria-pressed="true">Airflow</button>
    <button class="btn" id="bLabels" type="button" aria-pressed="false">Labels</button>
    <button class="btn" id="bSound" type="button" aria-pressed="true">Sound</button>
  </div>
  <label class="throttle"><span>THROTTLE</span><input type="range" id="throttle" min="0" max="100" value="60" aria-label="Throttle"><output id="thrOut">60%</output></label>
  <div class="row scroll collapsible" id="partChips"></div>
</section>

<script type="module">
// @ts-check
/*
 * NOTE ON "STRICT TYPESCRIPT": a single index.html cannot execute .ts in the browser
 * without a build step. This file is a strict-mode ES module written to be type-checked
 * (`// @ts-check` + JSDoc types, no implicit any, no undeclared globals), so it can be
 * validated with `tsc --allowJs --checkJs --strict` and runs as-is with no tooling.
 */
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/** @typedef {ReadonlyArray<readonly [number, number]>} Table */
/**
 * @typedef {Object} Part
 * @property {string} id
 * @property {string} name
 * @property {string} desc
 * @property {THREE.Group} group
 * @property {THREE.Vector3} anchor
 * @property {number} ox        explode shift along the engine axis
 * @property {number} rad       explode radial growth
 * @property {number} lift      explode vertical lift
 * @property {boolean} casing   low pick priority (outer shells)
 * @property {boolean} virtual  no geometry (airflow labels)
 * @property {number} hl        highlight 0..1
 * @property {HTMLElement} tag
 * @property {THREE.Object3D[]} pick
 */

const TAU = Math.PI * 2;
/** @param {string} id @returns {HTMLElement} */
const $ = (id) => { const e = document.getElementById(id); if (!e) throw new Error('Missing #' + id); return e; };
/** @param {number} v @param {number} a @param {number} b */
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
/** @param {number} a @param {number} b @param {number} v */
const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
/** @param {number} a @param {number} b @param {number} t */
const mix = (a, b, t) => a + (b - a) * t;
/** @param {Table} tbl @param {number} x */
function tab(tbl, x) {
  const first = tbl[0], last = tbl[tbl.length - 1];
  if (x <= first[0]) return first[1];
  if (x >= last[0]) return last[1];
  for (let i = 1; i < tbl.length; i++) {
    const b = tbl[i];
    if (x <= b[0]) { const a = tbl[i - 1]; return mix(a[1], b[1], (x - a[0]) / ((b[0] - a[0]) || 1e-6)); }
  }
  return last[1];
}
/** @param {Table} tbl @param {number} x0 @param {number} x1 @param {number} n @param {number} [dr] @returns {Array<[number, number]>} */
function sample(tbl, x0, x1, n, dr = 0) {
  /** @type {Array<[number, number]>} */ const o = [];
  for (let i = 0; i <= n; i++) { const x = mix(x0, x1, i / n); o.push([x, tab(tbl, x) + dr]); }
  return o;
}

/* ------------------------------------------------------------------ */
/* Engine geometry tables (x = axis, + toward exhaust; r = radius)    */
/* ------------------------------------------------------------------ */
/** @type {Table} */ const CORE_R = [[-4.3,.95],[-2.7,.88],[-2.55,.82],[-.7,.6],[-.4,.8],[1.4,.8],[1.7,.7],[2.3,.72],[2.5,.8],[4.3,1.1],[4.4,1.1],[5.8,.75]];
/** @type {Table} */ const HUB = [[-6.1,0],[-6.0,.12],[-5.8,.22],[-5.5,.32],[-5.2,.42],[-4.9,.5],[-4.3,.42],[-2.7,.55],[-2.5,.5],[-.7,.52],[-.4,.46],[1.4,.46],[1.7,.45],[2.3,.5],[2.5,.5],[4.3,.8],[4.45,.72],[4.6,.62],[5.4,.3],[6.2,0]];
/** @type {Table} */ const NAC_IN = [[-5.7,2.1],[-5.3,2.05],[-4.4,2.1],[-2,2.15],[0,1.95],[3,1.5],[4.4,1.35]];
/** @type {Table} */ const NAC_OUT = [[-5.72,2.12],[-5.55,2.3],[-5.1,2.46],[-4.4,2.55],[-2,2.52],[1.2,2.25],[3,1.8],[4.4,1.45]];
/** @type {Table} */ const CORE_V = [[-9,4.5],[-4.3,4.5],[-4,3.4],[-.7,2.6],[-.4,3],[1.4,4.5],[1.7,6],[4.4,7],[5.8,9],[11,10]];
/** @type {Table} */ const BYP_V = [[-9,4.5],[-5,5],[-4,7],[4.4,7],[5,10],[11,10]];
/** @type {Table} */ const PRESSURE = [[-8.5,1],[-5.5,1],[-4.4,1.6],[-2.7,5],[-.7,40],[-.4,38],[1.4,36],[2.3,14],[4.3,3],[5.8,1.3],[10.5,1]];
/** @type {Table} */ const TEMP = [[-8.5,288],[-5.5,288],[-4.4,330],[-2.7,520],[-.7,900],[-.4,910],[.2,1700],[1.4,1900],[2.3,1500],[4.3,1000],[5.8,800],[10.5,600]];
/** @type {Table} */ const OFFS = [[-9,-4.2],[-5,-4.2],[-3.45,-2.7],[-1.5,-1.4],[.5,0],[1.8,1.4],[3.3,2.8],[5.1,4.2],[11,4.2]];

/** @param {number} x */ const rc = (x) => tab(CORE_R, x);
/** @param {number} x */ const hubR = (x) => tab(HUB, x);
/** @param {number} x */ const coreOut = (x) => x < -4.3 ? .95 : x <= 5.8 ? rc(x) - .05 : .7 + (x - 5.8) * .18;
/** @param {number} x */ const bypIn = (x) => coreOut(x) + .08;
/** @param {number} x */ const bypOut = (x) => x <= 4.4 ? tab(NAC_IN, x) - .07 : 1.28 + (x - 4.4) * .1;

/* ------------------------------------------------------------------ */
/* Renderer / scene / camera                                          */
/* ------------------------------------------------------------------ */
const canvas = /** @type {HTMLCanvasElement} */ ($('c'));
const isMobile = Math.min(window.innerWidth, window.innerHeight) < 700 || /Mobi|Android/i.test(navigator.userAgent);
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, isMobile ? 1.5 : 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.localClippingEnabled = true;
renderer.setClearColor(0x000000, 0);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 220);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 3;
controls.maxDistance = 70;
controls.target.set(0.4, 0.4, 0);
controls.screenSpacePanning = true;
let userMoved = false;
controls.addEventListener('start', () => { userMoved = true; });

function fitCamera() {
  const aspect = window.innerWidth / window.innerHeight;
  const dist = Math.max(18, 8.5 / (Math.tan(THREE.MathUtils.degToRad(20)) * aspect));
  const dir = new THREE.Vector3(0.36, 0.24, 0.9).normalize();
  camera.position.copy(controls.target).addScaledVector(dir, dist);
}
fitCamera();

const key = new THREE.DirectionalLight(0xffffff, 2.4);
key.position.set(7, 14, 10);
key.castShadow = true;
key.shadow.mapSize.set(isMobile ? 1024 : 2048, isMobile ? 1024 : 2048);
Object.assign(key.shadow.camera, { left: -14, right: 14, top: 14, bottom: -14, near: 1, far: 45 });
key.shadow.bias = -0.0004;
key.shadow.normalBias = 0.02;
scene.add(key);
const rimLight = new THREE.DirectionalLight(0x6fa8ff, 0.9);
rimLight.position.set(-9, 3, -8);
scene.add(rimLight);
scene.add(new THREE.HemisphereLight(0xbfd4ff, 0x20242c, 0.35));

const floor = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.ShadowMaterial({ opacity: 0.38 }));
floor.rotation.x = -Math.PI / 2; floor.position.y = -4.6; floor.receiveShadow = true;
scene.add(floor);
const grid = new THREE.GridHelper(60, 60, 0x2a3646, 0x151c26);
grid.position.y = -4.58;
/** @type {THREE.Material} */ (grid.material).transparent = true;
/** @type {THREE.Material} */ (grid.material).opacity = 0.45;
scene.add(grid);

/** Soft round sprite texture drawn on a canvas (no external assets). */
const dotTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = /** @type {CanvasRenderingContext2D} */ (c.getContext('2d'));
  const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(.35, 'rgba(255,255,255,.6)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(c);
})();

/* ------------------------------------------------------------------ */
/* Parts registry, materials, helpers                                 */
/* ------------------------------------------------------------------ */
const engine = new THREE.Group();
scene.add(engine);
const cutPlane = new THREE.Plane(new THREE.Vector3(0, 0, -1), 3.5); // keeps z <= constant
const labelsEl = $('labels');
/** @type {Part[]} */ const parts = [];
/** @type {Record<string, Part>} */ const P = {};
/** @type {THREE.MeshStandardMaterial[]} */ const tracked = [];
/** @type {THREE.Object3D[]} */ const pickables = [];
/** @type {Array<{g: THREE.Object3D, k: 'n1' | 'n2'}>} */ const spinners = [];

/**
 * @param {string} id @param {string} name @param {string} desc @param {THREE.Vector3} anchor
 * @param {{ox?: number, rad?: number, lift?: number, casing?: boolean, virtual?: boolean}} [o]
 * @returns {Part}
 */
function addPart(id, name, desc, anchor, o = {}) {
  const group = new THREE.Group();
  if (!o.virtual) engine.add(group);
  const tag = document.createElement('div');
  tag.className = 'tag'; tag.textContent = name; labelsEl.appendChild(tag);
  /** @type {Part} */
  const p = { id, name, desc, group, anchor, ox: o.ox ?? 0, rad: o.rad ?? 0, lift: o.lift ?? 0, casing: !!o.casing, virtual: !!o.virtual, hl: 0, tag, pick: [] };
  parts.push(p); P[id] = p;
  return p;
}
/**
 * Metal-ish standard material whose emissive is driven by heat + highlight.
 * @param {Part} p @param {number} color
 * @param {{metal?: number, rough?: number, heat?: number, emissive?: number, side?: THREE.Side}} [o]
 */
function std(p, color, o = {}) {
  const m = new THREE.MeshStandardMaterial({ color, metalness: o.metal ?? 0.85, roughness: o.rough ?? 0.35, side: o.side ?? THREE.FrontSide });
  m.userData = { part: p, heat: o.heat ?? 0, base: new THREE.Color(o.emissive ?? 0x000000) };
  tracked.push(m);
  return m;
}
/** Translucent white shell that is clipped by the cutaway plane. @param {Part} p @param {number} color @param {number} opacity @param {number} [heat] */
function glass(p, color, opacity, heat = 0) {
  const m = new THREE.MeshPhysicalMaterial({ color, metalness: 0.05, roughness: 0.18, transparent: true, opacity, side: THREE.DoubleSide, depthWrite: false, clearcoat: 1, clearcoatRoughness: 0.2, clippingPlanes: [cutPlane] });
  m.userData = { part: p, heat, base: new THREE.Color(0x000000) };
  tracked.push(m);
  return m;
}
/** @param {Part} p @param {number} color */
function trim(p, color = 0xff7a1a) {
  const m = std(p, color, { metal: 0.35, rough: 0.35, emissive: 0x2a0d00 });
  m.clippingPlanes = [cutPlane];
  return m;
}
/**
 * Add a mesh to a part, registering shadow + picking.
 * @param {Part} p @param {THREE.Mesh} m @param {{parent?: THREE.Object3D, shadow?: boolean, pick?: boolean, order?: number}} [o]
 */
function put(p, m, o = {}) {
  (o.parent ?? p.group).add(m);
  m.castShadow = o.shadow ?? true;
  m.receiveShadow = false;
  if (o.order !== undefined) m.renderOrder = o.order;
  if (o.pick !== false) { m.userData.part = p; p.pick.push(m); pickables.push(m); }
  return m;
}
/** Lathe around the engine (x) axis from [x, r] pairs. @param {ReadonlyArray<readonly [number, number]>} pts @param {number} segs @param {THREE.Material} mat */
function lathe(pts, segs, mat) {
  const m = new THREE.Mesh(new THREE.LatheGeometry(pts.map(([x, r]) => new THREE.Vector2(Math.max(r, 0), x)), segs), mat);
  m.rotation.z = -Math.PI / 2;
  return m;
}
/** Ring/torus whose axis is x. @param {number} r @param {number} tube @param {number} x @param {THREE.Material} mat */
function ring(r, tube, x, mat) {
  const m = new THREE.Mesh(new THREE.TorusGeometry(r, tube, 12, 96), mat);
  m.rotation.y = Math.PI / 2; m.position.x = x;
  return m;
}
/** Disc/drum with axis x. @param {number} r @param {number} len @param {number} x @param {THREE.Material} mat */
function drum(r, len, x, mat) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, 40).rotateZ(Math.PI / 2), mat);
  m.position.x = x;
  return m;
}
/**
 * Ring of twisted, tapered blades as one InstancedMesh.
 * @param {number} count @param {number} r0 @param {number} r1 @param {number} chord @param {number} thick
 * @param {number} pitch @param {number} twist @param {THREE.Material} mat @param {number} x
 */
function bladeRing(count, r0, r1, chord, thick, pitch, twist, mat, x) {
  const len = Math.max(r1 - r0, 0.02);
  const g = new THREE.BoxGeometry(chord, len, thick, 1, 6, 1);
  const pos = g.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const y = pos.getY(i), t = y / len + 0.5, a = twist * (t - 0.5), taper = 1 - 0.25 * t;
    const px = pos.getX(i) * taper, pz = pos.getZ(i);
    pos.setX(i, px * Math.cos(a) + pz * Math.sin(a));
    pos.setZ(i, -px * Math.sin(a) + pz * Math.cos(a));
    pos.setY(i, y + r0 + len / 2);
  }
  g.computeVertexNormals();
  const im = new THREE.InstancedMesh(g, mat, count);
  const d = new THREE.Object3D();
  for (let i = 0; i < count; i++) {
    d.position.set(x, 0, 0);
    d.rotation.set((i / count) * TAU, pitch, 0);
    d.updateMatrix();
    im.setMatrixAt(i, d.matrix);
  }
  im.instanceMatrix.needsUpdate = true;
  im.frustumCulled = false;
  return im;
}

/* ------------------------------------------------------------------ */
/* Build the engine                                                   */
/* ------------------------------------------------------------------ */
const V = (/** @type {number} */ x, /** @type {number} */ y, /** @type {number} */ z) => new THREE.Vector3(x, y, z);
const mK = new THREE.Color();

// ---- Fan ----
{
  const p = addPart('fan', 'Fan Blades', 'Large titanium blades that gulp in air. About 90% of it bypasses the core and is thrown backward by the fan itself — most of the engine\u2019s thrust.', V(-4.75, 2.1, 0), { ox: -4.2 });
  const mBlade = std(p, 0xd3dae1, { metal: 0.9, rough: 0.27 });
  const mSpin = std(p, 0xff7a1a, { metal: 0.4, rough: 0.28, emissive: 0x1a0800 });
  const mVane = std(p, 0x9aa5b1, { metal: 0.85, rough: 0.35 });
  const rotor = new THREE.Group(); p.group.add(rotor); spinners.push({ g: rotor, k: 'n1' });
  const bl = bladeRing(20, 0.45, 2.0, 0.5, 0.05, 0.8, 0.7, mBlade, -4.75);
  bl.castShadow = true; bl.userData.part = p; p.pick.push(bl); pickables.push(bl); rotor.add(bl);
  put(p, drum(0.58, 0.36, -4.75, mBlade), { parent: rotor });

/** Heat / pressure colouring along the path. @param {'core' | 'bypass'} kind @param {number} x @param {number[]} out */
function flowColor(kind, x, out) {
  let r, g, b;
  if (kind === 'core') {
    if (x < -4.3) { r = .3; g = .75; b = 1; }
    else if (x < -.45) { const u = Math.pow((x + 4.3) / 3.85, 1.2); r = mix(.3, 1, u); g = mix(.75, .78, u); b = mix(1, .35, u); }
    else if (x < 1.45) { r = 1; g = .6; b = .2; }
    else if (x < 4.4) { const u = (x - 1.45) / 2.95; r = mix(1, .9, u); g = mix(.55, .28, u); b = mix(.18, .12, u); }
    else { const u = clamp((x - 4.4) / 6, 0, 1); r = mix(.9, .45, u); g = mix(.3, .2, u); b = mix(.12, .18, u); }
  } else if (x < -4.3) { r = .45; g = .8; b = 1; }
  else if (x < 4.4) { r = .6; g = .9; b = 1; }
  else { const u = clamp((x - 4.4) / 6, 0, 1); r = mix(.6, .75, u); g = mix(.9, .85, u); b = mix(1, .95, u); }
  const fade = 1 - smooth(6, 11, x) * 0.95 - smooth(-9, -7.5, -x) * 0;
  const inFade = smooth(-9.2, -7.8, x);
  const k = fade * inFade * 0.9;
  out[0] = r * k; out[1] = g * k; out[2] = b * k;
}
const tmpC = [0, 0, 0];
/** @param {Flow} fl @param {number} dt @param {number} thr @param {number} explode */
function updateFlow(fl, dt, thr, explode) {
  const core = fl.kind === 'core', tbl = core ? CORE_V : BYP_V;
  for (let i = 0; i < fl.count; i++) {
    let x = fl.x[i];
    x += tab(tbl, x) * fl.sp[i] * thr * dt * 0.9;
    if (x > 11) { x = -9 - Math.random() * 1.5; fl.f[i] = Math.random(); }
    fl.x[i] = x;
    const inn = core ? hubR(x) + 0.02 : bypIn(x);
    const out = core ? coreOut(x) : bypOut(x);
    const r = inn + (out - inn) * fl.f[i];
    fl.th[i] += (core ? (x > -4.3 && x < 4.4 ? 3.0 : 0.9) : 0.35) * thr * dt;
    const xd = x + tab(OFFS, x) * explode;
    const j = i * 3;
    fl.pos[j] = xd; fl.pos[j + 1] = r * Math.cos(fl.th[i]); fl.pos[j + 2] = r * Math.sin(fl.th[i]);
    flowColor(fl.kind, x, tmpC);
    fl.col[j] = tmpC[0]; fl.col[j + 1] = tmpC[1]; fl.col[j + 2] = tmpC[2];
  }
  fl.geo.attributes.position.needsUpdate = true;
  fl.geo.attributes.color.needsUpdate = true;
}

/** @type {{from: THREE.Vector3, to: THREE.Vector3, t: number} | null} */ let focusTween = null;

/** @param {number} x */
function focusX(x) { focusTween = { from: controls.target.clone(), to: new THREE.Vector3(x + tab(OFFS, x) * explode, 0.3, 0), t: 0 }; }

const stagesEl = $('stages');
STAGES.forEach((s) => {
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'chip'; b.style.setProperty('--c', s.color);
  b.innerHTML = '<i></i>' + s.name;
  b.addEventListener('click', () => { tracerX = s.start; focusX(s.focus); });
  stagesEl.appendChild(b); stageBtns.push(b);
});
const chipsEl = $('partChips');
/** @type {Map<string, HTMLButtonElement>} */ const partBtns = new Map();
parts.forEach((p) => {
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'chip'; b.style.setProperty('--c', '#ff7a1a');
  b.innerHTML = '<i></i>' + p.name;
  b.addEventListener('click', () => { selectPart(selected === p ? null : p); if (selected) focusX(p.virtual ? p.anchor.x : p.anchor.x); });
  chipsEl.appendChild(b); partBtns.set(p.id, b);
});
/** @param {Part | null} p */
function selectPart(p) { selected = p; partBtns.forEach((b, id) => b.classList.toggle('sel', !!p && p.id === id)); renderCard(); }
function renderCard() {
  const p = hovered ?? selected;
  const card = $('partCard');
  card.hidden = !p;
  if (p) { $('pName').textContent = p.name; $('pDesc').textContent = p.desc; }
}

/** @param {string} id @param {(on: boolean) => void} fn @param {boolean} init */
function toggle(id, fn, init) {
  const b = $(id); let on = init;
  b.setAttribute('aria-pressed', String(on));
  b.addEventListener('click', () => { on = !on; b.setAttribute('aria-pressed', String(on)); fn(on); });
}
toggle('bExplode', (on) => { explodeTarget = on ? 1 : 0; }, false);
toggle('bCut', (on) => { cutTarget = on ? 0 : 3.5; }, true);
toggle('bAir', (on) => { airflowOn = on; }, true);
toggle('bLabels', (on) => { labelsAll = on; }, false);
toggle('bSound', (on) => { soundOn = on; audio.setMuted(!on); if (on) audio.start(); }, true);
cutC = 3.5; cutTarget = 0;

const thrIn = /** @type {HTMLInputElement} */ ($('throttle'));
thrIn.addEventListener('input', () => { thrTarget = Number(thrIn.value) / 100; $('thrOut').textContent = thrIn.value + '%'; if (soundOn) audio.start(); });
$('dockToggle').addEventListener('click', () => {
  const d = $('dock'); d.classList.toggle('min');
  $('dockToggle').textContent = d.classList.contains('min') ? 'Controls ▴' : 'Controls ▾';
});

const velTag = document.createElement('div'); velTag.className = 'tag vel'; labelsEl.appendChild(velTag);

/* ------------------------------------------------------------------ */
/* Web Audio — subtle whine + rumble that follows the throttle        */
/* ------------------------------------------------------------------ */
class EngineAudio {
  constructor() {
    /** @type {AudioContext | null} */ this.ctx = null;
    /** @type {{master: GainNode, o1: OscillatorNode, o2: OscillatorNode, wf: BiquadFilterNode, lp: BiquadFilterNode, rg: GainNode, bp: BiquadFilterNode, hg: GainNode} | null} */ this.n = null;
    this.muted = false; this.t = 0.6;
  }
  start() {
    if (this.ctx) { if (this.ctx.state === 'suspended') void this.ctx.resume(); return; }
    const AC = window.AudioContext;
    if (!AC) return;
    const c = new AC(); this.ctx = c;
    const master = c.createGain(); master.gain.value = 0; master.connect(c.destination);
    const o1 = c.createOscillator(); o1.type = 'sawtooth';
    const o2 = c.createOscillator(); o2.type = 'triangle';
    const wf = c.createBiquadFilter(); wf.type = 'bandpass'; wf.Q.value = 6;
    const wg = c.createGain(); wg.gain.value = 0.05;
    o1.connect(wf); o2.connect(wf); wf.connect(wg); wg.connect(master); o1.start(); o2.start();
    const buf = c.createBuffer(1, c.sampleRate * 2, c.sampleRate);
    const d = buf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const src = c.createBufferSource(); src.buffer = buf; src.loop = true;
    const lp = c.createBiquadFilter(); lp.type = 'lowpass';
    const rg = c.createGain(); rg.gain.value = 0;
    const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 0.8;
    const hg = c.createGain(); hg.gain.value = 0;
    src.connect(lp); lp.connect(rg); rg.connect(master);
    src.connect(bp); bp.connect(hg); hg.connect(master); src.start();
    this.n = { master, o1, o2, wf, lp, rg, bp, hg };
    this.apply();
  }
  /** @param {boolean} m */ setMuted(m) { this.muted = m; this.apply(); }
  /** @param {number} t */ setThrottle(t) { this.t = t; this.apply(); }
  apply() {
    if (!this.ctx || !this.n) return;
    const n = this.n, now = this.ctx.currentTime, t = this.t;
    n.master.gain.setTargetAtTime(this.muted || t < 0.005 ? 0 : 0.4, now, 0.15);
    const f = 500 + 2400 * t;
    n.o1.frequency.setTargetAtTime(f, now, 0.1); n.o2.frequency.setTargetAtTime(f * 1.5, now, 0.1);
    n.wf.frequency.setTargetAtTime(900 + 2600 * t, now, 0.1);
    n.rg.gain.setTargetAtTime(0.28 * t, now, 0.12); n.lp.frequency.setTargetAtTime(160 + 900 * t, now, 0.1);
    n.hg.gain.setTargetAtTime(0.09 * t * t * t, now, 0.12); n.bp.frequency.setTargetAtTime(1800 + 2500 * t, now, 0.1);
  }
}
const audio = new EngineAudio();
window.addEventListener('pointerdown', () => { if (soundOn) audio.start(); });
window.addEventListener('keydown', () => { if (soundOn) audio.start(); });

/* ------------------------------------------------------------------ */
/* Picking (hover on desktop, tap/click everywhere)                   */
/* ------------------------------------------------------------------ */
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
/** @param {number} cx @param {number} cy @returns {Part | null} */
function pickAt(cx, cy) {
  ndc.set((cx / window.innerWidth) * 2 - 1, -(cy / window.innerHeight) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const hits = raycaster.intersectObjects(pickables, false);
  /** @type {Part | null} */ let fallback = null;
  for (const h of hits) {
    const p = /** @type {Part | undefined} */ (h.object.userData.part);
    if (!p) continue;
    if (h.object.userData.clipped && h.point.z > cutPlane.constant + 0.02) continue; // sliced away
    if (!p.casing) return p;
    if (!fallback) fallback = p;
  }
  return fallback;
}
canvas.addEventListener('pointermove', (e) => {
  if (e.pointerType !== 'mouse' || e.buttons) return;
  const p = pickAt(e.clientX, e.clientY);
  if (p !== hovered) { hovered = p; canvas.style.cursor = p ? 'pointer' : 'grab'; renderCard(); }
});
canvas.addEventListener('pointerleave', () => { if (hovered) { hovered = null; renderCard(); } });
let downX = 0, downY = 0;
canvas.addEventListener('pointerdown', (e) => { downX = e.clientX; downY = e.clientY; });
canvas.addEventListener('pointerup', (e) => {
  if (Math.hypot(e.clientX - downX, e.clientY - downY) > 6) return;
  const p = pickAt(e.clientX, e.clientY);
  selectPart(p && p !== selected ? p : null);
});

/* ------------------------------------------------------------------ */
/* Main loop                                                          */
/* ------------------------------------------------------------------ */
function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  if (!userMoved) fitCamera();
}
window.addEventListener('resize', resize);
resize();

const clock = new THREE.Clock();
let time = 0, flameTime = 0, audioClock = 0;
const v3 = new THREE.Vector3();
const arrowPos = new THREE.Vector3();

/** @param {Part} p */
function hlTarget(p) { return p === hovered || p === selected ? 1 : 0; }

function frame() {
  const dt = Math.min(clock.getDelta(), 0.05);
  time += dt;
  thr += (thrTarget - thr) * (1 - Math.exp(-dt * 1.8));
  if (Math.abs(thrTarget - thr) < 0.0005) thr = thrTarget;
  explode += (explodeTarget - explode) * (1 - Math.exp(-dt * 4));
  cutC += (cutTarget - cutC) * (1 - Math.exp(-dt * 3));
  cutPlane.constant = cutC;
  const ease = explode * explode * (3 - 2 * explode);

  // part transforms + highlight
  for (const p of parts) {
    p.hl += (hlTarget(p) - p.hl) * (1 - Math.exp(-dt * 10));
    if (p.virtual) continue;
    p.group.position.set(p.ox * ease, p.lift * ease, 0);
    const s = 1 + p.rad * ease; p.group.scale.set(1, s, s);
  }
  // emissive: heat glow scales with throttle, plus highlight
  for (const m of tracked) {
    const u = m.userData, h = u.heat * thr, hl = u.part.hl;
    m.emissive.copy(u.base);
    m.emissive.r += h + hl * 0.55; m.emissive.g += h * 0.26 + hl * 0.22; m.emissive.b += h * 0.04 + hl * 0.04;
  }

  // spin
  const w1 = thr * 8, w2 = thr * 10;
  for (const s of spinners) s.g.rotation.x += (s.k === 'n1' ? w1 : w2) * dt;
  /** @type {THREE.MeshBasicMaterial} */ (P.fan.group.userData.blurMat).opacity = 0.2 * Math.pow(thr, 1.6);

  // fire
  flameTime += dt * (0.25 + thr * 1.8);
  const flick = 0.88 + 0.12 * Math.sin(time * 23) * Math.sin(time * 7.3);
  for (const fm of fireMats) { fm.uniforms.uTime.value = flameTime; fm.uniforms.uPower.value = thr; fm.uniforms.uClip.value = cutPlane.constant; }
  fireLight.intensity = 10 * thr * flick;

  // airflow
  flows.core.pts.visible = flows.bypass.pts.visible = airflowOn;
  if (airflowOn) {
    updateFlow(flows.core, dt, thr, ease);
    updateFlow(flows.bypass, dt, thr, ease);
    flows.core.mat.size = flows.core.baseSize * (1 + 0.9 * P.core.hl);
    flows.bypass.mat.size = flows.bypass.baseSize * (1 + 0.9 * P.bypass.hl);
  }
  arrowGroup.visible = airflowOn;
  if (airflowOn) {
    for (const a of arrows) {
      const s = (time * 0.3 * thr + a.phase) % 1;
      const len = a.len * (0.35 + 0.65 * thr);
      const x = a.x0 + s * a.travel;
      a.root.position.set(x + tab(OFFS, x) * ease, Math.cos(a.a) * a.r, Math.sin(a.a) * a.r);
      a.shaft.scale.y = len; a.head.position.y = len;
      a.mat.opacity = Math.sin(Math.PI * s) * 0.85 * smooth(0.02, 0.2, thr);
    }
  }

  // tracer
  tracer.visible = airflowOn;
  tracerX += tab(CORE_V, tracerX) * thr * dt * 0.7;
  if (tracerX > 10.5) tracerX = -8.5;
  tracerTh += 2 * thr * dt;
  const tr = (hubR(tracerX) + coreOut(tracerX)) / 2;
  tracer.position.set(tracerX + tab(OFFS, tracerX) * ease, tr * Math.cos(tracerTh), tr * Math.sin(tracerTh));
  const st = stageOf(tracerX);
  tracerCore.material.color.set(STAGES[st].color);

  // HUD (throttled)
  uiTick += dt;
  if (st !== lastStage) {
    lastStage = st;
    $('stageName').textContent = STAGES[st].name; $('stageName').style.color = STAGES[st].color;
    $('stageDesc').textContent = STAGES[st].desc;
    stageBtns.forEach((b, i) => b.classList.toggle('active', i === st));
  }
  if (uiTick > 0.1) {
    uiTick = 0;
    $('rP').textContent = tab(PRESSURE, tracerX).toFixed(1) + ':1';
    $('rT').textContent = Math.round(tab(TEMP, tracerX)) + ' K';
    $('rN1').textContent = String(Math.round(thr * 3600));
    $('rN2').textContent = String(Math.round(thr * 11000));
    velTag.textContent = 'Exhaust \u2248 ' + Math.round(thr * 620) + ' m/s';
  }

  // audio follow
  audioClock += dt;
  if (audioClock > 0.08) { audioClock = 0; audio.setThrottle(thr); }

  // camera focus tween
  if (focusTween) {
    focusTween.t = Math.min(1, focusTween.t + dt / 0.9);
    const e = focusTween.t * focusTween.t * (3 - 2 * focusTween.t);
    v3.lerpVectors(focusTween.from, focusTween.to, e);
    camera.position.add(v3.clone().sub(controls.target));
    controls.target.copy(v3);
    if (focusTween.t >= 1) focusTween = null;
  }
  controls.update();

  // labels
  const w = window.innerWidth, h = window.innerHeight;
  for (const p of parts) {
    const show = labelsAll || p === hovered || p === selected;
    if (!show) { p.tag.classList.remove('on'); continue; }
    v3.copy(p.anchor).applyMatrix4(p.group.matrixWorld);
    if (p.virtual) v3.x += tab(OFFS, p.anchor.x) * ease;
    v3.project(camera);
    const vis = v3.z < 1 && Math.abs(v3.x) < 1.15 && Math.abs(v3.y) < 1.15 && (!p.virtual || airflowOn);
    p.tag.classList.toggle('on', vis);
    if (vis) p.tag.style.transform = `translate(${(v3.x * 0.5 + 0.5) * w}px, ${(-v3.y * 0.5 + 0.5) * h}px) translate(-50%, -135%)`;
  }
  arrowPos.set(8.6 + tab(OFFS, 8.6) * ease, 0.9, 0).project(camera);
  const velVis = airflowOn && thr > 0.02 && arrowPos.z < 1 && Math.abs(arrowPos.x) < 1.15;
  velTag.classList.toggle('on', velVis);
  if (velVis) velTag.style.transform = `translate(${(arrowPos.x * 0.5 + 0.5) * w}px, ${(-arrowPos.y * 0.5 + 0.5) * h}px) translate(-50%, -135%)`;

  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
renderCard();
requestAnimationFrame(frame);
</script>
</body>
</html>
